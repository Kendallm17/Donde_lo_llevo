  ];
  var T = {}; TYPES.forEach(function(t){ T[t.id] = t; });
  var CHIP = {b:'Baterías',c:'Celulares y tabletas',k:'Computadoras',s:'Pantallas',w:'Cables y accesorios',e:'Electrodomésticos pequeños',g:'Electrodomésticos grandes',r:'Refrigeración y A/C',l:'Lámparas',v:'Vapeadores'};

  var S = {type:null, prov:'', canton:'', op:'', perm:false, broken:false, all:false, shown:8, done:{}};
  var view = document.getElementById('view');
  var ttl = document.getElementById('ttl');
  var back = document.getElementById('back');
  var BACK = {residuo:'inicio',preparar:'residuo',puntos:'preparar',listo:'puntos'};
  var TITLES = {inicio:'¿Dónde lo llevo?',residuo:'¿Qué vas a desechar?',preparar:'Cómo prepararlo',puntos:'Puntos de recolección',listo:'Listo',datos:'Los datos'};

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function level(p, t){ return (p.ty && p.ty[t.k]) || 0; }
  function km(a, b, c, d){
    var R = 6371, r = Math.PI/180, dp = (c-a)*r, dl = (d-b)*r;
    var h = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dl/2)*Math.sin(dl/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function countBy(arr, f){ var o = {}; arr.forEach(function(x){ var k = f(x); o[k] = (o[k]||0) + 1; }); return o; }
  function cantonsOf(prov){
    var c = countBy(PTS.filter(function(p){ return p.p === prov; }), function(p){ return p.c; });
    return Object.keys(c).sort(function(a,b){ return a.localeCompare(b, 'es'); }).map(function(k){ return [k, c[k]]; });
  }
  function centroid(prov, canton){
    var xs = PTS.filter(function(p){ return p.p === prov && p.c === canton && p.y != null; });
    if(!xs.length) return null;
    var y = 0, x = 0; xs.forEach(function(p){ y += p.y; x += p.x; });
    return {y:y/xs.length, x:x/xs.length};
  }

  function query(){
    var t = T[S.type];
    var ref = (S.prov && S.canton) ? centroid(S.prov, S.canton) : null;
    var list = PTS.map(function(p){
      return {p:p, lv:level(p, t), d: ref && p.y != null ? km(ref.y, ref.x, p.y, p.x) : null};
    });
    if(!S.all) list = list.filter(function(r){ return r.lv > 0; });
    if(S.prov && !ref) list = list.filter(function(r){ return r.p.p === S.prov; });
    if(S.op) list = list.filter(function(r){ return r.p.op === S.op; });
    if(S.perm) list = list.filter(function(r){ return r.p.k === 'P'; });
    if(S.broken) list = list.filter(function(r){ return r.p.q === 's'; });
    list.sort(function(a, b){
      if(ref){
        if((b.lv>0) !== (a.lv>0)) return (b.lv>0) - (a.lv>0);
        return (a.d == null ? 1e9 : a.d) - (b.d == null ? 1e9 : b.d);
      }
      if(b.lv !== a.lv) return b.lv - a.lv;
      if(a.p.k !== b.p.k) return a.p.k === 'P' ? -1 : 1;
      return (a.p.p + a.p.c + a.p.n).localeCompare(b.p.p + b.p.c + b.p.n, 'es');
    });
    return {list:list, ref:ref};
  }

  function card(r, t){
    var p = r.p, lv = r.lv;
    var h = '<article class="pt' + (lv === 2 ? ' ok' : (lv === 1 ? ' prob' : '')) + '">';
    h += '<div class="row"><div style="min-width:0"><div class="name">' + esc(p.n) + '</div>';
    h += '<div class="meta">' + esc(p.c) + ', ' + esc(p.p) + ' · ' + esc(p.op) + '</div></div>';
    h += '<span class="tag ' + (lv === 2 ? 'good' : (lv === 1 ? 'prob' : '')) + '">' + (lv === 2 ? 'Recibe esto' : (lv === 1 ? 'Probable' : 'No lo declara')) + '</span></div>';
    if(r.d != null) h += '<div class="dist">≈ ' + r.d.toFixed(1).replace('.', ',') + ' km en línea recta</div>';
    if(p.a) h += '<p class="ln"><b>Dirección</b> ' + esc(p.a) + '</p>';
    if(p.h) h += '<p class="ln"><b>Horario</b> ' + esc(p.h) + '</p>';
    if(p.t) h += '<p class="ln"><b>Teléfono</b> ' + esc(p.t) + '</p>';
    h += '<div class="badges">';
    h += '<span class="bd ' + (p.k === 'P' ? 'g' : 'w') + '">' + (p.tl === 'Permanente' ? 'Permanente' : esc(p.tl || (p.k === 'P' ? 'Permanente' : 'Temporal'))) + '</span>';
    if(p.co === 'f') h += '<span class="bd g">Sin costo</span>';
    if(p.co === 'm') h += '<span class="bd w">Puede tener costo</span>';
    if(p.q === 's') h += '<span class="bd g">Acepta aparatos quebrados</span>';
    if(p.q === 'n') h += '<span class="bd">No acepta quebrados</span>';
    if(p.ca) h += '<span class="bd">' + esc(p.ca) + '</span>';
    if(p.inc) h += '<span class="bd">Incentivo: ' + esc(p.inc) + '</span>';
    h += '</div><div class="chips">';
    Object.keys(CHIP).forEach(function(k){
      var v = p.ty[k]; if(!v) return;
      h += '<span class="chip' + (k === t.k ? ' on' : '') + (v === 1 ? ' q' : '') + '">' + esc(CHIP[k]) + (v === 1 ? ' (confirma)' : '') + '</span>';
    });
    h += '</div>';
    h += '<details class="fc"><summary>Ver ficha completa</summary><div class="box">';
    if(p.d) h += '<div><b>Qué recibe según la ficha:</b> ' + esc(p.d) + '</div>';
    h += '<div><b>Tipo de punto:</b> ' + esc(p.tl || '') + '</div>';
    h += '<div><b>Administra:</b> ' + esc(p.en) + '</div>';
    if(p.cn) h += '<div><b>Costo:</b> ' + esc(p.cn) + '</div>';
    if(p.e) h += '<div><b>Correo:</b> ' + esc(p.e) + '</div>';
    h += '<div><b>Fuente:</b> Ministerio de Salud, registro n.º ' + esc(p.i) + '</div>';
    h += '</div></details>';
    if(p.u) h += '<a class="maplink" href="' + esc(p.u) + '" target="_blank" rel="noopener">Ver en mapa</a>';
    return h + '</article>';
  }

  var R = {
    inicio:function(){
      return ''+
      '<h1>Tu batería no es basura común.</h1>'+
      '<p class="lead muted">Dinos qué tienes y te decimos cómo prepararlo y a dónde llevarlo.</p>'+
      '<div class="homegrid"><div class="stat"><b>9 de 10</b><span>costarricenses no saben cómo desechar una batería de litio.</span></div>'+
      '<div class="facts"><div><b>' + fmt(M.total) + '</b><span>puntos de recolección</span></div><div><b>' + Object.keys(M.provs||{}).length + '</b><span>provincias</span></div><div><b>' + fmt((M.tipos||{}).b) + '</b><span>reciben baterías</span></div></div></div>'+
      '<p class="note" style="border-top:0;padding-top:0">Datos oficiales del Ministerio de Salud, última actualización en mayo de 2026. Confirma por teléfono antes de ir.</p>'+
      '<div class="btnrow"><button class="btn" data-go="residuo">Empezar</button>'+ '</div>';
    },
    residuo:function(){
      var h = '<h2>¿Qué vas a desechar?</h2><div class="grid">';
      TYPES.forEach(function(t){
        h += '<button class="opt' + (t.hot ? ' hot' : '') + '" data-type="' + t.id + '">' + t.icon + '<span><b>' + esc(t.label) + '</b><small>' + esc(t.sub) + '</small></span><span class="n">' + fmt((M.tipos||{})[t.k] || 0) + ' puntos</span></button>';
      });
      return h + '</div>';
    },
    preparar:function(){
      var t = T[S.type]; if(!t) return R.residuo();
      var d = S.done[t.id] || {};
      var h = '<div style="display:flex;gap:12px;align-items:center"><span style="width:44px;height:44px;color:var(--primary);flex:none;display:block">' + t.icon.replace('<svg ', '<svg width="44" height="44" ') + '</span><h2>' + esc(t.label) + '</h2></div>';
      if(t.warn) h += '<div class="alert">' + I.warn + '<span>' + esc(t.warn) + '</span></div>';
      h += '<ol class="steps">';
      t.steps.forEach(function(s, i){
        h += '<li class="' + (d[i] ? 'done' : '') + '"><button data-step="' + i + '" aria-pressed="' + (d[i] ? 'true' : 'false') + '"><span class="box">' + I.check + '</span><span class="t">' + esc(s) + '</span></button></li>';
      });
      return h + '</ol><button class="btn" data-go="puntos">Ver dónde llevarlo</button>';
    },
    puntos:function(){
      var t = T[S.type]; if(!t) return R.residuo();
      var q = query(), list = q.list;
      var provs = M.provs || {};
      var h = '<h2>Dónde llevar: ' + esc(t.label.toLowerCase()) + '</h2>';
      h += '<div class="filters">';
      h += '<div class="frow"><div class="field"><label for="prov">Provincia</label><select id="prov"><option value="">Todo el país</option>';
      Object.keys(provs).sort(function(a,b){ return a.localeCompare(b, 'es'); }).forEach(function(p){
        h += '<option value="' + esc(p) + '"' + (p === S.prov ? ' selected' : '') + '>' + esc(p) + ' (' + provs[p] + ')</option>';
      });
      h += '</select></div><div class="field"><label for="canton">Cantón</label><select id="canton"' + (S.prov ? '' : ' disabled') + '><option value="">Todos</option>';
      if(S.prov) cantonsOf(S.prov).forEach(function(c){ h += '<option value="' + esc(c[0]) + '"' + (c[0] === S.canton ? ' selected' : '') + '>' + esc(c[0]) + ' (' + c[1] + ')</option>'; });
      h += '</select></div>';
      h += '<div class="field op"><label for="op">Operador</label><select id="op"><option value="">Todos</option>';
      Object.keys(M.ops || {}).forEach(function(o){ h += '<option value="' + esc(o) + '"' + (o === S.op ? ' selected' : '') + '>' + esc(o) + ' (' + M.ops[o] + ')</option>'; });
      h += '</select></div></div><div class="toggles">';
      h += '<button class="tg" data-tg="perm" aria-pressed="' + S.perm + '">Solo permanentes</button>';
      h += '<button class="tg" data-tg="broken" aria-pressed="' + S.broken + '">Mi aparato está quebrado</button>';
      h += '<button class="tg" data-tg="all" aria-pressed="' + S.all + '">Incluir los que no lo declaran</button>';
      h += '</div></div>';
      h += '<div class="count">' + fmt(list.length) + (list.length === 1 ? ' punto' : ' puntos') + (q.ref ? ' · ordenados por cercanía al centro de ' + esc(S.canton) : '') + '</div>';
      if(!S.prov) h += '<p class="note" style="border-top:0;padding-top:0;margin-top:-6px">Elige provincia y cantón para ordenarlos del más cercano al más lejano.</p>';
      if(!list.length){
        h += '<div class="alert">' + I.warn + '<span>Ningún punto cumple esos filtros. Quita alguno o cambia de cantón.</span></div>';
      }
      h += '<div class="cards">';
      list.slice(0, S.shown).forEach(function(r){ h += card(r, t); });
      h += '</div>';
      if(list.length > S.shown) h += '<button class="btn ghost small" data-more="1">Ver ' + Math.min(8, list.length - S.shown) + ' más</button>';
      h += '<button class="btn" data-go="listo">Ya lo entregué</button>';
      h += '<p class="note">Fuente: Mapa de Puntos de Recolección y Recepción de RAEE del Ministerio de Salud, última actualización en mayo de 2026. Horarios y condiciones pueden haber cambiado: llama antes de ir. La distancia es en línea recta desde el centro del cantón, no una ruta.</p>';
      return h;
    },
    listo:function(){
      var t = T[S.type]; if(!t) return R.residuo();
      var m = 'Descubrí que mi ' + t.label.toLowerCase() + ' no va a la basura común. Se lleva a un punto de recolección autorizado. Revisa dónde en "¿Dónde lo llevo?" y avísale a alguien más.';
      return ''+
      '<h2>Buen trabajo.</h2>'+
      '<p class="lead">Tu ' + esc(t.label.toLowerCase()) + ' va a manejo formal en lugar de terminar en la calle o en el relleno.</p>'+
      '<div class="stat"><span style="font-size:16px"><b style="font-size:20px;display:block;margin-bottom:4px;font-family:var(--font-display)">Por qué importa</b>' + esc(t.why) + '</span></div>'+
      '<h3>Cuéntale a alguien más</h3>'+
      '<div class="msg" id="msg">' + esc(m) + '</div>'+
      '<button class="btn" data-copy="1">Copiar mensaje</button>'+
      '<button class="btn ghost" data-go="residuo">Desechar otra cosa</button>';
    },
    datos:function(){
      var provs = M.provs || {}, ops = M.ops || {};
      var max = Math.max.apply(null, Object.keys(provs).map(function(k){ return provs[k]; }).concat([1]));
      var h = '<h2>Los datos</h2>';
      h += '<div class="src"><div><span class="k">Datos oficiales</span><b>Mapa de Puntos de Recolección y Recepción de Residuos de Aparatos Eléctricos y Electrónicos (RAEE)</b>, del Ministerio de Salud.</div>';
      h += '<div><span class="k">Última actualización</span><b>Mayo de 2026</b></div></div>';
      h += '<div class="facts"><div><b>' + fmt(M.total) + '</b><span>puntos en la base</span></div><div><b>' + fmt(M.perm) + '</b><span>permanentes</span></div><div><b>' + fmt(M.total - M.perm) + '</b><span>temporales u ocasionales</span></div></div>';
      h += '<h3>Puntos por provincia</h3><div class="bars">';
      Object.keys(provs).sort(function(a, b){ return provs[b] - provs[a]; }).forEach(function(k){
        h += '<div class="r"><span>' + esc(k) + '</span><span class="bar"><i style="width:' + Math.round(provs[k] / max * 100) + '%"></i></span><span>' + provs[k] + '</span></div>';
      });
      h += '</div><h3>Quién opera los puntos</h3><div class="bars">';
      var omax = Math.max.apply(null, Object.keys(ops).map(function(k){ return ops[k]; }).concat([1]));
      Object.keys(ops).forEach(function(k){
        h += '<div class="r"><span>' + esc(k) + '</span><span class="bar"><i style="width:' + Math.round(ops[k] / omax * 100) + '%"></i></span><span>' + ops[k] + '</span></div>';
      });
      h += '</div><p class="note">Los horarios y las condiciones pueden cambiar. Llama antes de ir. Esta app no pide cuenta ni ubicación y no guarda datos de quien la usa.</p>';
      return h;
    }
  };

  function route(){
    var h = (location.hash || '#inicio').slice(1);
    if(!R[h]) h = 'inicio';
    if((h === 'preparar' || h === 'puntos' || h === 'listo') && !S.type) h = 'residuo';
    ttl.textContent = TITLES[h];
    back.hidden = !BACK[h];
    view.innerHTML = R[h]();
    var cur = (h === 'datos' || h === 'inicio') ? h : 'residuo';
    document.querySelectorAll('#tabs button').forEach(function(b){
      if(b.dataset.go === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }
  function rerender(focusId){
    var y = window.scrollY; var h = (location.hash || '#inicio').slice(1);
    view.innerHTML = R[h](); window.scrollTo(0, y);
    if(focusId){ var el = document.getElementById(focusId); if(el) el.focus(); }
  }
  function go(h){ if(location.hash === '#' + h) route(); else location.hash = h; }

  function toast(t){
    var el = document.getElementById('toast'); el.textContent = t; el.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function(){ el.hidden = true; }, 2200);
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-go],[data-type],[data-step],[data-copy],[data-tg],[data-more],#back');
    if(!el) return;
    if(el.id === 'back'){ var h = (location.hash || '#inicio').slice(1); go(BACK[h] || 'inicio'); return; }
    if(el.dataset.type){ S.type = el.dataset.type; S.shown = 8; go('preparar'); return; }
    if(el.dataset.step !== undefined){
      var d = S.done[S.type] || (S.done[S.type] = {}); d[el.dataset.step] = !d[el.dataset.step];
      rerender(); return;
    }
    if(el.dataset.tg){ S[el.dataset.tg] = !S[el.dataset.tg]; S.shown = 8; rerender(); return; }
    if(el.dataset.more){ S.shown += 8; rerender(); return; }
    if(el.dataset.copy){
      var txt = document.getElementById('msg').textContent;
      var ok = function(){ toast('Mensaje copiado'); };
      var fail = function(){
        var r = document.createRange(); r.selectNodeContents(document.getElementById('msg'));
        var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selecciónalo y cópialo');
      };
      try{ navigator.clipboard.writeText(txt).then(ok, fail); }catch(_){ fail(); }
      return;
    }
    if(el.dataset.go){ go(el.dataset.go); }
  });
  document.addEventListener('change', function(e){
    var id = e.target.id;
    if(id === 'prov'){ S.prov = e.target.value; S.canton = ''; S.shown = 8; rerender('prov'); }
    else if(id === 'canton'){ S.canton = e.target.value; S.shown = 8; rerender('canton'); }
    else if(id === 'op'){ S.op = e.target.value; S.shown = 8; rerender('op'); }
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
